<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .matrix-table {
            width: 200px;
            margin: 10px 0;
            border: 2px solid #343a40;
        }
        .matrix-table td {
            width: 40px;
            height: 40px;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            border: 1px solid #dee2e6;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card p-3 mb-4 bg-dark text-white">
            <h5>Sinh viên thực hiện: Lê Minh Thiên</h5>
            <p class="mb-0 text-info">MSSV: 2380602095</p>
        </div>

        <table class="table table-bordered">
            <thead>
                <tr class="bg-light">
                    <th style="text-align: center; font-size: 25px;" colspan="2">PLAYFAIR CIPHER SYSTEM</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="width: 50%;">
                        <h5 class="font-weight-bold text-primary">ENCRYPTION (MÃ HÓA)</h5>
                        <form method="POST" action="/api/playfair/encrypt">
                            <div class="form-group">
                                <label>Plain text:</label>
                                <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus />
                            </div>
                            <div class="form-group">
                                <label>Key (Text):</label>
                                <input type="text" class="form-control" name="inputKeyPlain" placeholder="e.g. MONARCHY" required />
                            </div>
                            <button type="submit" class="btn btn-primary">Encrypt</button>
                        </form>
                    </td>

                    <td style="width: 50%;">
                        <h5 class="font-weight-bold text-success">DECRYPTION (GIẢI MÃ)</h5>
                        <form method="POST" action="/api/playfair/decrypt">
                            <div class="form-group">
                                <label>Cipher text:</label>
                                <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required />
                            </div>
                            <div class="form-group">
                                <label>Key (Text):</label>
                                <input type="text" class="form-control" name="inputKeyCipher" placeholder="e.g. MONARCHY" required />
                            </div>
                            <button type="submit" class="btn btn-success">Decrypt</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
